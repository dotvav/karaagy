[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karaagy"
version = "0.2.0"
description = "High-performance OpenAI-compatible REST & SSE API gateway for Google Antigravity CLI"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Vincent Roukine" }
]
keywords = ["openai", "antigravity", "gemini", "fastapi", "llm-gateway", "sse-streaming", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "uvicorn>=0.32.0",
]

[project.urls]
Homepage = "https://github.com/dotvav/karaagy"
Repository = "https://github.com/dotvav/karaagy"
Documentation = "https://github.com/dotvav/karaagy#readme"
Issues = "https://github.com/dotvav/karaagy/issues"

[project.scripts]
karaagy = "karaagy.main:cli_entrypoint"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "T20", # flake8-print
]
ignore = ["E501", "B904", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*",
    "ignore:.*starlette.testclient.*",
]
