<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Karaagy Logo - Version 2: Flat Concentric Singularity Gateway -->
  <!-- 100% Solid Flat Colors, Zero Gradients, Zero Blurs, Transparent Canvas -->

  <g id="outer-singularity-rings">
    <!-- Outer Orbit Ring (Segmented Cyan & Violet Arcs) -->
    <circle cx="256" cy="256" r="210" fill="none" stroke="#6D28D9" stroke-width="12" stroke-dasharray="180 30 60 30" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="185" fill="none" stroke="#0891B2" stroke-width="10" stroke-dasharray="100 25 140 35" stroke-linecap="round"/>
    
    <!-- Portal Frame Ring (Solid Deep Indigo) -->
    <circle cx="256" cy="256" r="155" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="12"/>
    
    <!-- Event Horizon Aperture Void (Solid Black/Slate) -->
    <circle cx="256" cy="256" r="120" fill="#0F172A" stroke="#06B6D4" stroke-width="8"/>
  </g>

  <g id="gateway-emitter-nodes">
    <!-- 4 Cardinal Tech Emitters -->
    <!-- Top -->
    <circle cx="256" cy="46" r="16" fill="#06B6D4" stroke="#0891B2" stroke-width="4"/>
    <circle cx="256" cy="46" r="6" fill="#FFFFFF"/>
    <!-- Bottom -->
    <circle cx="256" cy="466" r="16" fill="#06B6D4" stroke="#0891B2" stroke-width="4"/>
    <circle cx="256" cy="466" r="6" fill="#FFFFFF"/>
    <!-- Left -->
    <circle cx="46" cy="256" r="16" fill="#8B5CF6" stroke="#6D28D9" stroke-width="4"/>
    <circle cx="46" cy="256" r="6" fill="#FFFFFF"/>
    <!-- Right -->
    <circle cx="466" cy="256" r="16" fill="#8B5CF6" stroke="#6D28D9" stroke-width="4"/>
    <circle cx="466" cy="256" r="6" fill="#FFFFFF"/>
  </g>

  <g id="karaage-core-nugget">
    <!-- Symmetrical Cel-Shaded Karaage Nugget levitating at Event Horizon -->
    
    <!-- Dark Contour Base -->
    <path d="M 256 165 
             C 295 165, 335 185, 345 220 
             C 355 255, 340 295, 315 325 
             C 290 355, 222 355, 197 325 
             C 172 295, 157 255, 167 220 
             C 177 185, 217 165, 256 165 Z" 
          fill="#451A03" stroke="#451A03" stroke-width="8" stroke-linejoin="round"/>

    <!-- Main Golden Amber Body -->
    <path d="M 256 172 
             C 290 172, 328 190, 336 222 
             C 345 254, 332 290, 308 318 
             C 285 346, 227 346, 204 318 
             C 180 290, 167 254, 176 222 
             C 184 190, 222 172, 256 172 Z" 
          fill="#D97706"/>

    <!-- Deep Shading Crust Layers (#92400E & #78350F) -->
    <path d="M 176 222 C 184 190, 222 172, 256 172 C 240 195, 220 230, 215 270 C 210 300, 195 315, 185 310 C 172 280, 170 250, 176 222 Z" fill="#92400E"/>
    <path d="M 204 318 C 227 346, 285 346, 308 318 C 290 330, 260 335, 235 328 C 215 322, 200 325, 204 318 Z" fill="#78350F"/>
    <path d="M 310 215 C 335 240, 340 275, 335 305 C 320 280, 310 260, 295 250 C 285 242, 295 225, 310 215 Z" fill="#B45309"/>

    <!-- Midtone Golden Blocks (#F59E0B) -->
    <polygon points="235,185 275,180 290,210 255,230 220,210" fill="#F59E0B"/>
    <polygon points="270,215 320,200 330,235 290,255 255,235" fill="#F59E0B"/>
    <polygon points="215,225 255,235 245,285 200,275 190,240" fill="#F59E0B"/>
    <polygon points="255,260 305,250 315,290 270,310 240,290" fill="#F59E0B"/>
    <polygon points="205,285 245,295 235,330 195,315 185,290" fill="#F59E0B"/>

    <!-- Crisp Highlight Facets (#FBBF24 & #FDE047) -->
    <polygon points="245,190 270,185 280,205 255,212 235,202" fill="#FBBF24"/>
    <polygon points="280,208 310,202 320,222 295,232 275,220" fill="#FDE047"/>
    <polygon points="225,235 248,242 240,265 215,260" fill="#FDE047"/>
    <polygon points="265,268 295,260 305,280 278,288" fill="#FBBF24"/>
    <polygon points="212,295 235,300 228,318 205,310" fill="#FDE047"/>

    <!-- Panko / Crisp Crumbs -->
    <circle cx="230" cy="180" r="4" fill="#FEF08A"/>
    <circle cx="295" cy="190" r="5" fill="#FEF08A"/>
    <circle cx="330" cy="250" r="5" fill="#FDE047"/>
    <circle cx="180" cy="260" r="4" fill="#FDE047"/>
    <circle cx="265" cy="325" r="5" fill="#FEF08A"/>
  </g>

  <g id="gravitational-orbit-sparks">
    <!-- Diagonal Diamond Accents -->
    <polygon points="256,115 264,100 272,115 264,130" fill="#06B6D4"/>
    <polygon points="256,397 264,382 272,397 264,412" fill="#06B6D4"/>
    <polygon points="115,256 100,264 115,272 130,264" fill="#8B5CF6"/>
    <polygon points="397,256 382,264 397,272 412,264" fill="#8B5CF6"/>

    <!-- Diagonal Sparks -->
    <polygon points="150,150 158,135 166,150 158,165" fill="#22D3EE"/>
    <polygon points="362,150 370,135 378,150 370,165" fill="#A855F7"/>
    <polygon points="150,362 158,347 166,362 158,377" fill="#A855F7"/>
    <polygon points="362,362 370,347 378,362 370,377" fill="#22D3EE"/>

    <!-- Orbiting Energy Dots -->
    <circle cx="130" cy="200" r="5" fill="#FDE047"/>
    <circle cx="382" cy="200" r="5" fill="#FDE047"/>
    <circle cx="130" cy="312" r="5" fill="#FBBF24"/>
    <circle cx="382" cy="312" r="5" fill="#FBBF24"/>
  </g>
</svg>
